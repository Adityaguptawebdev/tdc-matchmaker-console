# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The frontend is deployed separately to Vercel (see apps/web/vercel.json).
services:
  - type: web
    name: tdc-matchmaker-api
    runtime: node
    plan: free
    # Pick the Render region closest to your MongoDB Atlas cluster (oregon | ohio | virginia | frankfurt |
    # singapore). Every request makes several DB round-trips, so distance to Atlas dominates latency.
    # region: singapore
    # Monorepo root: the API build bundles the workspace packages it imports.
    buildCommand: npm ci --include=dev && npm run build -w @tdc/api
    startCommand: npm run start -w @tdc/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      - key: DATA_STORE
        value: mongo
      - key: MONGODB_URI
        sync: false # Atlas URI incl. database name, e.g. mongodb+srv://USER:PASSWORD@HOST/tdc_matchmaker?retryWrites=true&w=majority
      - key: MONGO_CONNECT_TIMEOUT_MS
        value: '10000'
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: TRUST_PROXY
        value: 'true'
      - key: AUTO_SEED
        value: 'true'
      - key: OPENAI_API_KEY
        sync: false # optional — leave unset to use deterministic fallbacks
      - key: OPENAI_MODEL
        value: gpt-4o-mini
